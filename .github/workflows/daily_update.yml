name: Mise à jour Telediario (5x par jour)

on:
  schedule:
    # 06h45 UTC = 07h45 Paris (Telediario Matinal)
    - cron: '45 6 * * *'
    # 09h30 UTC = 10h30 Paris (Rattrapage Matinal)
    - cron: '30 9 * * *'
    # 14h45 UTC = 15h45 Paris (Telediario 1 de 15h)
    - cron: '45 14 * * *'
    # 17h30 UTC = 18h30 Paris (Rattrapage Telediario 1)
    - cron: '30 17 * * *'
    # 21h45 UTC = 22h45 Paris (Telediario 2 du soir + consolidation complète)
    - cron: '45 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-telediarios:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exécution du script de mise à jour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_telediario.py

      - name: Sauvegarde et publication automatique
        run: |
          git config --global user.name "Telediario Bot"
          git config --global user.email "bot@telediario.local"
          git add data/telediarios.json data/telediarios.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique Telediario [skip ci]" && git push)
